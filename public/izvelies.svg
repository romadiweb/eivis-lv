    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.46;.52;.79;.86;1" />
    <circle cx="651" cy="221" r="19" fill="#337CD4" stroke="#FFFFFF" stroke-width="3"/>
    <path d="m643 221 5 5 11-12" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</g>
