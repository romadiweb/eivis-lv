<svg xmlns="http://www.w3.org/2000/svg" width="825" height="465" viewBox="105 75 825 465" fill="none" role="img" aria-label="Izvēlies — neatkarīgu EIVIS moduļu izvēle">
<title>Izvēlies — neatkarīgu EIVIS moduļu izvēle</title>
<defs>
<filter id="softshadow" x="-35%" y="-35%" width="170%" height="190%"><feDropShadow dx="0" dy="14" stdDeviation="19" flood-color="#405575" flood-opacity=".105"/></filter>
<filter id="tinyshadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#405575" flood-opacity=".13"/></filter>
<linearGradient id="frontleft" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#F6F7FA"/><stop offset="1" stop-color="#D9DEE6"/></linearGradient>
<linearGradient id="frontright" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#C9D2E0"/><stop offset="1" stop-color="#A9B5C6"/></linearGradient>
<linearGradient id="blueleft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#498BDF"/><stop offset="1" stop-color="#2169C5"/></linearGradient>
<linearGradient id="blueright" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#CCE4FF"/><stop offset="1" stop-color="#9AC7F7"/></linearGradient>
<linearGradient id="topface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F4F8"/></linearGradient>
</defs>
<style>
svg { overflow:visible; shape-rendering:geometricPrecision; }
* { vector-effect:non-scaling-stroke; }
</style>
