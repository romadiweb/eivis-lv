      <!-- Fitted to slot x=436..674 y=205..315; 6 px inner margin. -->
      <rect x="442" y="211" width="226" height="98" rx="17" fill="#FFFFFF" stroke="#6486B4" stroke-width="2.3" filter="url(#tinyshadow)"/>
