<!-- Inserted component matches the slot precisely, including dashboard perspective. -->
<g transform="rotate(-5 430 310)">
  <g opacity="0">
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.08;.21;.79;.90;1" />
    <g transform="translate(0 0)">
