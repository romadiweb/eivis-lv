<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="180 80 640 440" fill="none">
<defs>
  <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F9FCFF" stop-opacity=".9"/><stop offset="1" stop-color="#E8F2FF" stop-opacity=".36"/></linearGradient>
  <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EDF5FF"/><stop offset="1" stop-color="#CDE2FD" stop-opacity=".72"/></linearGradient>
  <filter id="shadow" x="-50%" y="-70%" width="200%" height="250%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#8FB5E0" flood-opacity=".13"/></filter>
  <path id="a" d="M500 300 Q445 249 347 204"/>
  <path id="b" d="M500 300 Q555 249 653 204"/>
  <path id="c" d="M500 300 Q445 351 347 396"/>
  <path id="d" d="M500 300 Q555 351 653 396"/>
  <style>
    .line {stroke:#C7D9EA;stroke-width:1.4;stroke-linecap:round;fill:none}
    .ghost {stroke:#DAE6F2;stroke-width:1;stroke-dasharray:2 9;fill:none;opacity:.5}
    .tile {fill:url(#shell);stroke:#BBD1E7;stroke-width:1.5}
    .inner {stroke:#DAE6F4;stroke-width:1.05;fill:none}
    .active {stroke:#4C8CE2;stroke-width:1.8;stroke-linecap:round;fill:none;opacity:0;stroke-dasharray:0 500;}
    @media (prefers-reduced-motion: reduce) { .active {animation:none!important;opacity:.46;stroke-dasharray:none} }
  </style>
</defs>
<!-- Construction marks remain stationary -->
<g class="ghost"><path d="M205 300 H795"/><path d="M500 100 V500"/><path d="M275 160 L725 440"/><path d="M275 440 L725 160"/></g>
<!-- Thin connection infrastructure -->
<g class="line"><use href="#a"/><use href="#b"/><use href="#c"/><use href="#d"/></g>
<!-- Quiet progressive connection highlights, no traveling dots -->
<g stroke="#4C8CE2" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85">
  <path d="M500 300 Q445 249 347 204" stroke-dasharray="250" stroke-dashoffset="250">
    <animate attributeName="stroke-dashoffset" values="250;250;0;0;250" keyTimes="0;.05;.27;.82;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".15;1;1;.2;.15" keyTimes="0;.06;.27;.82;1" dur="7s" repeatCount="indefinite"/>
  </path>
  <path d="M500 300 Q555 249 653 204" stroke-dasharray="250" stroke-dashoffset="250">
    <animate attributeName="stroke-dashoffset" values="250;250;0;0;250" keyTimes="0;.15;.37;.82;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".15;.15;1;.2;.15" keyTimes="0;.15;.37;.82;1" dur="7s" repeatCount="indefinite"/>
  </path>
  <path d="M500 300 Q445 351 347 396" stroke-dasharray="250" stroke-dashoffset="250">
    <animate attributeName="stroke-dashoffset" values="250;250;0;0;250" keyTimes="0;.25;.47;.82;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".15;.15;1;.2;.15" keyTimes="0;.25;.47;.82;1" dur="7s" repeatCount="indefinite"/>
  </path>
  <path d="M500 300 Q555 351 653 396" stroke-dasharray="250" stroke-dashoffset="250">
    <animate attributeName="stroke-dashoffset" values="250;250;0;0;250" keyTimes="0;.35;.57;.82;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".15;.15;1;.2;.15" keyTimes="0;.35;.57;.82;1" dur="7s" repeatCount="indefinite"/>
  </path>
</g>
<!-- Balanced small architectural panels -->
<g filter="url(#shadow)">
  <g transform="translate(283 159)"><rect x="0" y="0" width="128" height="90" rx="26" class="tile"/><rect x="14" y="13" width="100" height="64" rx="18" class="inner"/><path d="M27 45 H101" class="inner"/></g>
  <g transform="translate(589 159)"><rect x="0" y="0" width="128" height="90" rx="26" class="tile"/><rect x="14" y="13" width="100" height="64" rx="18" class="inner"/><path d="M27 45 H101" class="inner"/></g>
  <g transform="translate(283 351)"><rect x="0" y="0" width="128" height="90" rx="26" class="tile"/><rect x="14" y="13" width="100" height="64" rx="18" class="inner"/><path d="M27 45 H101" class="inner"/></g>
  <g transform="translate(589 351)"><rect x="0" y="0" width="128" height="90" rx="26" class="tile"/><rect x="14" y="13" width="100" height="64" rx="18" class="inner"/><path d="M27 45 H101" class="inner"/></g>
  <g><rect x="448" y="248" width="104" height="104" rx="26" fill="url(#core)" stroke="#91B9EC" stroke-width="1.5"/><rect x="461" y="261" width="78" height="78" rx="20" class="inner"/><rect x="485" y="285" width="30" height="30" rx="7" fill="#F6FAFF" stroke="#7AA9E7" stroke-width="1.4"/></g>
</g>
<!-- Delicate anchor rings -->
<g class="inner" opacity=".56"><ellipse cx="500" cy="300" rx="124" ry="77"/><ellipse cx="500" cy="300" rx="147" ry="92"/></g>
</svg>
