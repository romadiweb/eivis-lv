<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="180 100 640 400" fill="none">
  <defs>
    <linearGradient id="frameStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D6E4F1"/>
      <stop offset="100%" stop-color="#BDD1E6"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FBFF" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#EAF3FF" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="blueGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF6FF" stop-opacity="0.96"/>
      <stop offset="55%" stop-color="#D9EAFF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#A7CDF5" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="blueStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A4CBF5"/>
      <stop offset="100%" stop-color="#5C95E5"/>
    </linearGradient>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#A8C5EA" flood-opacity="0.16"/>
    </filter>
    <style>
      .outline{stroke:url(#frameStroke); stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round;}
      .fine{stroke:#D9E6F2; stroke-width:1.05; stroke-linecap:round; stroke-linejoin:round;}
      .finer{stroke:#E7EFF7; stroke-width:1; stroke-linecap:round; stroke-linejoin:round;}
      .bluefine{stroke:#B6D2F1; stroke-width:1.15; stroke-linecap:round; stroke-linejoin:round;}
      .ghost{stroke:#EDF3F8; stroke-width:1; opacity:.55}
      .dashed{stroke:#D9E5F1; stroke-width:1; stroke-dasharray:1 7; stroke-linecap:round; opacity:.72}
      .tile{fill:url(#blueGlass); stroke:url(#blueStroke); stroke-width:1.45;}
      .slot{fill:none; stroke:#DBE7F2; stroke-width:1.2; stroke-linecap:round; stroke-linejoin:round;}
      .surface{fill:url(#glassFill); stroke:url(#frameStroke); stroke-width:1.35;}
    </style>
  </defs>

  <!-- construction lines -->
  <g opacity="0.55">
    <line x1="190" y1="300" x2="810" y2="300" class="dashed"/>
    <line x1="500" y1="120" x2="500" y2="480" class="dashed"/>
    <line x1="290" y1="188" x2="710" y2="412" class="ghost"/>
    <line x1="290" y1="412" x2="710" y2="188" class="ghost"/>
  </g>

  <!-- base frame -->
  <g filter="url(#softShadow)">
    <rect x="238" y="158" width="348" height="284" rx="40" fill="#FCFEFF" fill-opacity="0.34" class="outline"/>
    <rect x="258" y="178" width="308" height="244" rx="34" fill="#FFFFFF" fill-opacity="0.18" class="fine"/>
  </g>

  <!-- base internal layout guides -->
  <g opacity="0.95">
    <rect x="290" y="212" width="112" height="78" rx="24" class="slot"/>
    <rect x="422" y="212" width="112" height="78" rx="24" class="slot"/>
    <rect x="290" y="310" width="244" height="78" rx="26" class="slot"/>
    <path d="M412 212 V388" class="finer"/>
    <path d="M290 300 H534" class="finer" opacity="0.6"/>
  </g>

  <!-- existing system modules (static) -->
  <g filter="url(#softShadow)">
    <rect x="298" y="220" width="96" height="62" rx="22" class="tile"/>
    <path d="M320 252 H372" class="bluefine"/>
    <path d="M320 264 H354" class="bluefine" opacity="0.72"/>

    <rect x="430" y="220" width="96" height="62" rx="22" class="tile"/>
    <path d="M452 250 C468 236 492 236 508 250" class="bluefine"/>
    <path d="M452 264 H500" class="bluefine" opacity="0.72"/>

    <rect x="298" y="318" width="228" height="62" rx="24" class="tile"/>
    <path d="M322 350 H502" class="bluefine"/>
    <path d="M322 362 H444" class="bluefine" opacity="0.72"/>
  </g>

  <!-- extension bay scaffold -->
  <g opacity="0.92">
    <path d="M586 230 H618" class="finer"/>
    <path d="M586 370 H618" class="finer"/>
  </g>

  <!-- bridge / expansion rail -->
  <g id="bridgeGroup" opacity="0">
    <path d="M586 300 H634" class="bluefine"/>
    <path d="M586 286 H634" class="finer" opacity="0.55"/>
    <path d="M586 314 H634" class="finer" opacity="0.55"/>
    <circle cx="634" cy="300" r="4.8" fill="#FFFFFF" stroke="#BFD3E6" stroke-width="1.25"/>
    <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.18;0.28;0.78;0.9;1" dur="8.6s" repeatCount="indefinite"/>
  </g>

  <!-- extension frame appears -->
  <g id="extensionFrame" opacity="0" filter="url(#softShadow)">
    <rect x="626" y="190" width="136" height="220" rx="34" fill="#FCFEFF" fill-opacity="0.30" class="outline"/>
    <rect x="642" y="206" width="104" height="188" rx="28" fill="#FFFFFF" fill-opacity="0.16" class="fine"/>
    <rect x="658" y="224" width="72" height="94" rx="22" class="slot"/>
    <rect x="658" y="336" width="72" height="40" rx="18" class="slot"/>
    <animate attributeName="opacity" values="0;0;0.9;0.9;0.9;0" keyTimes="0;0.18;0.32;0.82;0.9;1" dur="8.6s" repeatCount="indefinite"/>
  </g>

  <!-- extension highlight wash -->
  <g id="extGlow" opacity="0">
    <rect x="636" y="200" width="116" height="198" rx="30" fill="#DCEEFF" opacity="0.16"/>
    <animate attributeName="opacity" values="0;0;0.55;0.18;0.55;0" keyTimes="0;0.24;0.38;0.52;0.82;1" dur="8.6s" repeatCount="indefinite"/>
  </g>

  <!-- new modules entering extension -->
  <g id="newTall" opacity="0" transform="translate(0 10)" filter="url(#softShadow)">
    <rect x="666" y="232" width="56" height="78" rx="20" class="tile"/>
    <path d="M684 252 H704" class="bluefine"/>
    <path d="M684 264 H704" class="bluefine" opacity="0.78"/>
    <path d="M684 276 H698" class="bluefine" opacity="0.58"/>
    <animate attributeName="opacity" values="0;0;0;1;1;1;0" keyTimes="0;0.30;0.36;0.46;0.82;0.92;1" dur="8.6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 10; 0 10; 0 10; 0 0; 0 0; 0 0; 0 10" keyTimes="0;0.30;0.36;0.46;0.82;0.92;1" dur="8.6s" repeatCount="indefinite"/>
  </g>

  <g id="newSmall" opacity="0" transform="translate(0 10)" filter="url(#softShadow)">
    <rect x="666" y="342" width="56" height="28" rx="14" class="tile"/>
    <path d="M682 356 H706" class="bluefine"/>
    <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.40;0.48;0.56;0.66;0.9;1" dur="8.6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 10; 0 10; 0 10; 0 10; 0 0; 0 0; 0 10" keyTimes="0;0.40;0.48;0.56;0.66;0.9;1" dur="8.6s" repeatCount="indefinite"/>
  </g>

  <!-- subtle signal in the bridge when extension activates -->
  <g opacity="0">
    <circle r="4.6" fill="#7BAFF0">
      <animateMotion dur="8.6s" repeatCount="indefinite" keyTimes="0;0.22;0.28;0.34;1" keySplines="0.42 0 0.22 1;0.42 0 0.22 1;0.42 0 0.22 1;0.42 0 0.22 1" calcMode="spline"
        path="M586 300 H634"/>
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.22;0.28;0.34;1" dur="8.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- tiny endpoint anchors -->
  <g opacity="0.88">
    <circle cx="258" cy="300" r="4.2" fill="#ffffff" stroke="#C8D8E8" stroke-width="1.1"/>
    <circle cx="742" cy="300" r="4.2" fill="#ffffff" stroke="#C8D8E8" stroke-width="1.1"/>
  </g>

  <!-- hold-state accent after full expansion -->
  <g opacity="0">
    <rect x="650" y="214" width="88" height="172" rx="26" fill="#EAF4FF" opacity="0.22"/>
    <animate attributeName="opacity" values="0;0;0;0;0.45;0.45;0" keyTimes="0;0.52;0.60;0.68;0.78;0.86;1" dur="8.6s" repeatCount="indefinite"/>
  </g>
</svg>
