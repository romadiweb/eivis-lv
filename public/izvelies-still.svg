<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="180 105 640 380" fill="none" role="img" aria-labelledby="art-title art-desc">
<title id="art-title">Izvēlies — EIVIS modular selection</title>
<desc id="art-desc">A quiet architectural composition of thin isometric module planes. A translucent blue layer rises subtly above a fixed selection slot.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FEFFFF"/><stop offset="1" stop-color="#F6F8FB"/></linearGradient>
  <linearGradient id="blue" x1=".17" y1=".05" x2=".8" y2="1"><stop stop-color="#BBD9FF" stop-opacity=".88"/><stop offset="1" stop-color="#EAF4FF" stop-opacity=".50"/></linearGradient>
  <linearGradient id="blue-edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7EB5F8"/><stop offset="1" stop-color="#427FD7"/></linearGradient>
  <linearGradient id="grey-edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#DDE4EE"/><stop offset="1" stop-color="#BBC8D7"/></linearGradient>
  <filter id="soft" x="-35%" y="-80%" width="170%" height="260%"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<style>
  .line { stroke:#BAC7D6; stroke-width:1.45; stroke-linecap:round; stroke-linejoin:round; }
  .quiet { stroke:#D4DDE8; stroke-width:1.2; stroke-linecap:round; stroke-linejoin:round; }
  .edge { stroke:#AFC0D4; stroke-width:1.25; stroke-linejoin:round; }
  .active {  transform-box:fill-box; transform-origin:center; }
  .inner-line {  }
  @keyframes slow-rise { 0%,12%,89%,100%{transform:translateY(0)} 34%,68%{transform:translateY(-13px)} }
  @keyframes breathe { 0%,12%,89%,100%{opacity:.48} 34%,68%{opacity:1} }
  @media (prefers-reduced-motion:reduce){.active,.inner-line{}}
</style>
<!-- All faint structural geometry is static. -->
<ellipse cx="504" cy="439" rx="254" ry="32" fill="#97ACC7" opacity=".08" filter="url(#soft)"/>
<!-- left empty module tray -->
<path d="M251 294 Q248 290 253 287 L339 243 Q344 241 349 243 L436 286 Q443 290 437 294 L350 339 Q345 342 339 339Z" fill="url(#paper)" stroke="#CDD7E3" stroke-width="1.4"/>
<path d="M251 294v10q0 3 4 5l84 42q6 3 10 0l87-44q3-2 3-5v-10" stroke="#DBE2EA" stroke-width="1.35"/>
<path d="M251 304 340 352 M439 302 350 352" stroke="#DFE5EC" stroke-width="1.1"/>
<path d="M280 289 344 257 408 289 344 321Z" stroke="#DDE5EE" stroke-width="1.15" stroke-dasharray="5 6"/>
<!-- right empty module tray -->
<path d="M563 294 Q559 290 565 287 L650 243 Q655 241 660 243 L748 286 Q754 290 749 294 L660 339 Q656 342 651 339Z" fill="url(#paper)" stroke="#CDD7E3" stroke-width="1.4"/>
<path d="M563 294v10q0 3 4 5l84 42q6 3 10 0l87-44q3-2 3-5v-10" stroke="#DBE2EA" stroke-width="1.35"/>
<path d="M563 304 651 352 M751 302 661 352" stroke="#DFE5EC" stroke-width="1.1"/>
<path d="M591 289 655 257 719 289 655 321Z" stroke="#DDE5EE" stroke-width="1.15" stroke-dasharray="5 6"/>
<!-- mid-plane selection bay, held in position -->
<path d="M392 294 500 238 608 294 500 351Z" fill="#F9FBFF" fill-opacity=".72" stroke="#A8BCD3" stroke-width="1.45" stroke-dasharray="5 7"/>
<path d="M392 295v13L500 365 608 307v-13" stroke="#E1E8F1" stroke-width="1.25" stroke-linejoin="round"/>
<path d="M500 351v14" stroke="#C8D5E6" stroke-width="1.25"/>
<!-- exposed optical guides / no functional UI metaphors -->
<path d="M500 122v50 M500 381v55" class="quiet" stroke-dasharray="3 7"/>
<circle cx="500" cy="121" r="3.1" fill="#CDD9E9"/>
<circle cx="500" cy="438" r="3.1" fill="#CDD9E9"/>
<!-- thin translucent chosen module; the only moving object -->
<g class="active">
  <path d="M387 267 500 208 613 267 500 326Z" fill="#8ABFF4" opacity=".13" filter="url(#soft)" transform="translate(0 11)"/>
  <path d="M388 267v8l112 59 112-59v-8L500 326Z" fill="#B6D7FF" fill-opacity=".34" stroke="#8DB6E8" stroke-width="1.25" stroke-linejoin="round"/>
  <path d="M389 266 Q386 264 390 262 L496 207 Q500 205 504 207 L610 262 Q614 264 611 266 L504 322 Q500 324 496 322Z" fill="url(#blue)" stroke="#6B9FD9" stroke-width="1.55"/>
  <path class="inner-line" d="m424 263 76-40 76 40-76 40Z" stroke="url(#blue-edge)" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="m484 255 16-9 16 9-16 9Z" fill="#4F8DDC" fill-opacity=".56" stroke="#4E86CB" stroke-width="1.1"/>
  <path d="M500 264v12" stroke="#4E86CB" stroke-width="1.2"/>
</g>
<!-- three short peripheral register marks, decorative but stationary -->
<path d="M347 207v-20 M341 192h12 M655 207v-20 M649 192h12" stroke="#D6DFEA" stroke-width="1.1" stroke-linecap="round"/>
<path d="M500 168v-14" stroke="#A9BFDC" stroke-width="1.3" stroke-linecap="round"/>
</svg>
